<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Übe, Phishing-Nachrichten zu erkennen: Entscheide bei echten Alltagsnachrichten, ob sie echt oder Phishing sind.">
    <title>Phishing-Simulator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/app.js"></script>
  </head>

  <body>
    <div id="app"></div>

    <!-- Icons: Lucide (lucide.dev), ISC-Lizenz -->

    <template id="vorlage-start">
      <header class="kopfzeile">
        <div class="container kopfzeile__inhalt">
          <div class="logo">
            <span class="logo__icon">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
            <span class="logo__name">Phishing-Simulator</span>
          </div>
        </div>
      </header>

      <main class="container inhalt">
        <div class="spalte spalte--haupt">
          <p class="chip chip--lila start__thema">Training gegen Phishing</p>
          <h1 class="start__titel">Erkennst du den Fake?</h1>
          <p class="start__einleitung">
            Du siehst <span class="start__anzahl"></span> Nachrichten aus dem Alltag.
            Entscheide jeweils: echt oder Phishing? Danach erfährst du, woran man es erkennt.
          </p>
          <ul class="chips">
            <li class="chip start__chip-anzahl"></li>
            <li class="chip start__chip-dauer"></li>
            <li class="chip chip--lila">mit Erklärung</li>
          </ul>
          <div class="aktionen">
            <button class="button button--primaer start__button" type="button">
              Training starten
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
          </div>
        </div>

        <div class="spalte start__illustration" aria-hidden="true">
          <div class="illustration">
            <span class="illustration__frage">?</span>
            <div class="vorschau">
              <p class="vorschau__kopf"><span>SMS · +44 7700 900461</span><span>09:14</span></p>
              <p class="vorschau__text">Ihr Paket konnte nicht zugestellt werden. Gebühr CHF 1.95 bezahlen …</p>
            </div>
            <div class="vorschau vorschau--haupt">
              <p class="vorschau__kopf"><span>E-Mail · Deine Bank</span><span>jetzt</span></p>
              <p class="vorschau__text">Dein Konto wird in 24 Std. gesperrt. Jetzt bestätigen!</p>
            </div>
            <div class="vorschau">
              <p class="vorschau__kopf"><span>Instagram</span><span>gestern</span></p>
              <p class="vorschau__text">Dein Account verstösst gegen unsere Richtlinien.</p>
            </div>
          </div>
        </div>
      </main>
    </template>

    <template id="vorlage-situation">
      <header class="kopfzeile">
        <div class="container kopfzeile__inhalt">
          <button class="button button--klein situation__beenden" type="button" aria-label="Training beenden">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            <span class="nur-desktop">Beenden</span>
          </button>
          <p class="situation__zaehler">
            Situation <span class="situation__nummer"></span> von <span class="situation__anzahl"></span>
          </p>
          <progress class="fortschritt situation__fortschritt" aria-label="Fortschritt"></progress>
          <p class="punkte">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
            <span class="situation__punkte"></span>
            <span class="nur-desktop">Punkte</span>
          </p>
        </div>
      </header>

      <main class="container inhalt">
        <div class="spalte">
          <p class="chip chip--blau situation__kanal">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            <span class="situation__kanal-name"></span>
          </p>
          <div class="situation__nachricht"></div>
        </div>

        <div class="spalte spalte--haupt situation__entscheidung">
          <h1 class="situation__frage">Ist diese Nachricht echt oder Phishing?</h1>
          <p class="situation__tipp">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
            Tipp: Achte auf Absender, Link und Zeitdruck.
          </p>
          <div class="aktionen">
            <button class="antwort antwort--echt situation__echt" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
              Echt
            </button>
            <button class="antwort antwort--phishing situation__phishing" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
              Phishing
            </button>
          </div>
        </div>
      </main>
    </template>

    <template id="vorlage-sms">
      <article class="nachricht">
        <div class="nachricht__kopf">
          <span class="nachricht__avatar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <div>
            <p class="nachricht__absender"></p>
            <p class="nachricht__zeit"></p>
          </div>
        </div>
        <p class="nachricht__blase">
          <span class="nachricht__text"></span>
          <span class="nachricht__link"></span>
        </p>
      </article>
    </template>

    <template id="vorlage-fehler">
      <main class="container inhalt">
        <p class="fehlermeldung" role="alert">
          Die Situationen konnten nicht geladen werden. Bitte lade die Seite neu.
        </p>
      </main>
    </template>
  </body>
</html>
