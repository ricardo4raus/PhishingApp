<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Übe, Phishing-Nachrichten zu erkennen: Entscheide bei realistischen Alltagsnachrichten, ob sie echt oder Phishing sind.">
    <title>Phishing-Simulator</title>

    <script src="js/farbschema.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/app.js"></script>
  </head>

  <body>
    <div id="app"></div>

    <!-- Icons: Lucide (lucide.dev), ISC-Lizenz -->

    <template id="vorlage-start">
      <div class="bildschirm">
        <header class="kopfzeile">
          <div class="container kopfzeile__inhalt">
            <div class="logo">
              <span class="logo__icon">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
              </span>
              <span class="logo__name">Phishing-Simulator</span>
            </div>
            <button class="button button--klein farbschema-knopf" type="button" aria-label="Hell- oder Dunkelmodus wechseln" title="Hell- oder Dunkelmodus wechseln">
              <svg class="icon farbschema-knopf__mond" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              <svg class="icon farbschema-knopf__sonne" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>
          </div>
        </header>

        <main class="container inhalt">
          <div class="spalte spalte--haupt">
            <p class="chip chip--lila start__thema">Training gegen Phishing</p>
            <h1 class="start__titel" tabindex="-1">Erkennst du den Fake?</h1>
            <p class="start__einleitung">
              Du siehst <span class="start__anzahl"></span> Nachrichten aus dem Alltag.
              Entscheide jeweils: echt oder Phishing? Danach erfährst du, woran man es erkennt.
            </p>
            <ul class="chips" role="list">
              <li class="chip start__chip-anzahl"></li>
              <li class="chip start__chip-dauer"></li>
              <li class="chip chip--lila">mit Erklärung</li>
            </ul>
            <div class="aktionen">
              <button class="button button--primaer start__button" type="button">
                Training starten
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </button>
            </div>
          </div>

          <div class="spalte start__illustration" aria-hidden="true">
            <div class="illustration">
              <span class="illustration__frage">?</span>
              <div class="vorschau vorschau--links">
                <p class="vorschau__kopf"><span>SMS · +44 7700 900461</span><span>09:14</span></p>
                <p class="vorschau__text">Ihr Paket konnte nicht zugestellt werden. Gebühr CHF 1.95 bezahlen …</p>
              </div>
              <div class="vorschau vorschau--haupt vorschau--eingerueckt">
                <p class="vorschau__kopf"><span>E-Mail · Deine Bank</span><span>jetzt</span></p>
                <p class="vorschau__text">Dein Konto wird in 24 Std. gesperrt. Jetzt bestätigen!</p>
              </div>
              <div class="vorschau vorschau--rechts">
                <p class="vorschau__kopf"><span>Instagram</span><span>gestern</span></p>
                <p class="vorschau__text">Dein Account verstösst gegen unsere Richtlinien.</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </template>

    <template id="vorlage-situation">
      <div class="bildschirm">
        <header class="kopfzeile">
          <div class="container kopfzeile__inhalt">
            <button class="button button--klein situation__beenden" type="button" aria-label="Training beenden">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              <span class="nur-desktop">Beenden</span>
            </button>
            <p class="situation__zaehler">
              <span class="situation__zaehler-wort">Situation</span> <span class="situation__nummer"></span> von <span class="situation__anzahl"></span>
            </p>
            <div class="fortschritt situation__fortschritt" role="progressbar" aria-label="Fortschritt" aria-valuemin="0">
              <div class="fortschritt__balken"></div>
            </div>
            <p class="punkte">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
              <span class="situation__punkte"></span>
              <span class="nur-desktop situation__punkte-wort"></span>
            </p>
            <button class="button button--klein farbschema-knopf" type="button" aria-label="Hell- oder Dunkelmodus wechseln" title="Hell- oder Dunkelmodus wechseln">
              <svg class="icon farbschema-knopf__mond" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              <svg class="icon farbschema-knopf__sonne" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>
          </div>
        </header>

        <main class="container inhalt inhalt--situation">
          <div class="spalte">
            <p class="chip chip--blau situation__kanal">
              <svg class="icon situation__icon-chat" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
              <svg class="icon situation__icon-mail" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <span class="situation__kanal-name"></span>
            </p>
            <p class="kontext situation__kontext" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              <span class="kontext__text"></span>
            </p>
            <div class="situation__nachricht" tabindex="-1"></div>
          </div>

          <div class="spalte spalte--haupt situation__entscheidung">
            <h1 class="situation__frage" tabindex="-1">Ist diese Nachricht echt oder Phishing?</h1>
            <p class="situation__tipp">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
              Tipp: Achte auf Absender, Link und Zeitdruck.
            </p>
            <div class="aktionen">
              <button class="antwort antwort--echt situation__echt" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                Echt
              </button>
              <button class="antwort antwort--phishing situation__phishing" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                Phishing
              </button>
            </div>
          </div>
        </main>
      </div>
    </template>

    <template id="vorlage-resultat">
      <div class="bildschirm">
        <header class="kopfzeile">
          <div class="container kopfzeile__inhalt">
            <div class="logo">
              <span class="logo__icon">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
              </span>
              <span class="logo__name">Phishing-Simulator</span>
            </div>
            <button class="button button--klein farbschema-knopf" type="button" aria-label="Hell- oder Dunkelmodus wechseln" title="Hell- oder Dunkelmodus wechseln">
              <svg class="icon farbschema-knopf__mond" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              <svg class="icon farbschema-knopf__sonne" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>
          </div>
        </header>

        <main class="resultat">
          <div class="container inhalt inhalt--resultat">
            <div class="spalte resultat__bewertung">
              <p class="resultat__ueberschrift">Dein Resultat</p>
              <div class="resultat__kreis">
                <svg class="resultat__ring" viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="resultat__ring-spur" cx="60" cy="60" r="52" pathLength="100"/>
                  <circle class="resultat__ring-wert" cx="60" cy="60" r="52" pathLength="100"/>
                </svg>
                <p class="resultat__punkte">
                  <span class="resultat__zahl"></span>
                  <span class="resultat__einheit">richtig</span>
                </p>
              </div>
              <h1 class="resultat__titel" tabindex="-1"></h1>
              <p class="resultat__text"></p>
            </div>

            <div class="spalte spalte--haupt resultat__details">
              <div class="resultat__statistik">
                <p class="statistik">
                  <span class="statistik__name">Phishing erkannt</span>
                  <span class="statistik__wert resultat__phishing-erkannt"></span>
                </p>
                <p class="statistik">
                  <span class="statistik__name">Echte erkannt</span>
                  <span class="statistik__wert resultat__echte-erkannt"></span>
                </p>
              </div>
              <div class="resultat__tipps">
                <h2 class="resultat__tipps-titel">Darauf solltest du achten</h2>
                <ul class="chips resultat__tipps-liste" role="list"></ul>
              </div>
              <div class="aktionen">
                <button class="button button--primaer resultat__nochmals" type="button">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                  Nochmals spielen
                </button>
              </div>
            </div>
          </div>

          <section class="container antworten" aria-labelledby="antworten-titel">
            <h2 class="antworten__titel" id="antworten-titel">Deine Antworten</h2>
            <p class="antworten__hinweis">Öffne eine Situation, um die Nachricht nochmals zu sehen. Bei Fehlern steht, woran du es erkennst und wie du richtig reagierst.</p>
            <ol class="antworten__liste" role="list"></ol>
          </section>
        </main>
      </div>
    </template>

    <template id="vorlage-antwort-eintrag">
      <li class="antwort-eintrag">
        <details class="antwort-eintrag__details">
          <summary class="antwort-eintrag__zusammenfassung">
            <span class="antwort-eintrag__status">
              <svg class="icon antwort-eintrag__icon-richtig" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
              <svg class="icon antwort-eintrag__icon-falsch" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </span>
            <span class="antwort-eintrag__beschreibung">
              <span class="antwort-eintrag__titel"></span>
              <span class="antwort-eintrag__ergebnis"></span>
            </span>
            <svg class="icon antwort-eintrag__pfeil" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </summary>
          <div class="antwort-eintrag__inhalt">
            <div class="antwort-eintrag__situation">
              <p class="kontext antwort-eintrag__kontext" hidden>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                <span class="kontext__text"></span>
              </p>
              <div class="antwort-eintrag__nachricht"></div>
            </div>
          </div>
        </details>
      </li>
    </template>

    <template id="vorlage-erklaerung">
      <div class="erklaerung">
        <h3 class="erklaerung__titel"></h3>
        <ol class="erklaerung__merkmale" role="list"></ol>
        <div class="reaktion">
          <h3 class="reaktion__titel">So reagierst du richtig</h3>
          <ul class="reaktion__liste"></ul>
        </div>
      </div>
    </template>

    <template id="vorlage-merkmal">
      <li class="merkmal">
        <span class="merkmal__nummer" aria-hidden="true"></span>
        <p class="merkmal__titel"></p>
        <p class="merkmal__text"></p>
      </li>
    </template>

    <template id="vorlage-linkvorschau">
      <p class="linkvorschau" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="linkvorschau__inhalt">
          <span class="linkvorschau__hinweis">Fahre über den Link oder tippe darauf, um zu sehen, wohin er wirklich führt.</span>
          <span class="linkvorschau__ziel"></span>
        </span>
      </p>
    </template>

    <template id="vorlage-sms">
      <article class="sms">
        <header class="sms__kopf">
          <span class="sms__avatar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <p class="sms__absender"></p>
          <p class="sms__art">Textnachricht</p>
        </header>
        <p class="sms__zeit"></p>
        <div class="sms__verlauf"></div>
      </article>
    </template>

    <template id="vorlage-email">
      <article class="email">
        <div class="email__werkzeuge" aria-hidden="true">
          <span class="email__werkzeug">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
            Antworten
          </span>
          <span class="email__werkzeug">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            Löschen
          </span>
        </div>
        <p class="email__betreff"></p>
        <div class="email__kopf">
          <span class="email__avatar" aria-hidden="true"></span>
          <div class="email__personen">
            <p class="email__absender"></p>
            <p class="email__adresse"></p>
            <p class="email__empfaenger">An: mich</p>
          </div>
          <p class="email__zeit"></p>
        </div>
        <div class="email__inhalt"></div>
      </article>
    </template>

    <template id="vorlage-whatsapp">
      <article class="whatsapp">
        <header class="whatsapp__kopf">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          <span class="whatsapp__avatar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <p class="whatsapp__absender"></p>
          <span class="whatsapp__aktionen" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
            <svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
        </header>
        <div class="whatsapp__verlauf">
          <p class="whatsapp__hinweis">Diese Nummer ist nicht in deinen Kontakten gespeichert.</p>
        </div>
      </article>
    </template>

    <template id="vorlage-instagram">
      <article class="instagram">
        <header class="instagram__kopf">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          <span class="instagram__avatar">
            <span class="instagram__avatar-bild">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
          </span>
          <div class="instagram__person">
            <p class="instagram__absender"></p>
            <p class="instagram__konto"></p>
          </div>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </header>
        <div class="instagram__verlauf">
          <p class="instagram__zeit"></p>
        </div>
      </article>
    </template>
    <template id="vorlage-fehler">
      <div class="bildschirm">
        <main class="container inhalt">
          <p class="fehlermeldung" role="alert">
            Die Situationen konnten nicht geladen werden. Bitte lade die Seite neu.
          </p>
        </main>
      </div>
    </template>
  </body>
</html>
